<style>
/* ============================================================
   STYLES-DASHBOARD.CSS — Dashboard View Styles
   Stat Cards · Progress Bars · Season Summary
   ============================================================ */

/* ── STAT CARD GRID ── */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: var(--sp-4);
  margin-bottom: var(--sp-8);
}

.stat-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: var(--sp-5) var(--sp-6);
  position: relative;
  overflow: hidden;
  transition: border-color var(--t-base), transform var(--t-base);
  cursor: default;
}

.stat-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  border-radius: var(--r-lg) var(--r-lg) 0 0;
}

.stat-card.gold::before   { background: var(--accent); }
.stat-card.green::before  { background: var(--green); }
.stat-card.blue::before   { background: var(--blue); }
.stat-card.red::before    { background: var(--red); }
.stat-card.purple::before { background: var(--purple); }

.stat-card:hover {
  border-color: var(--border-light);
  transform: translateY(-2px);
}

.stat-label {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--text-muted);
  margin-bottom: var(--sp-3);
  display: flex;
  align-items: center;
  gap: var(--sp-2);
}

.stat-value {
  font-family: var(--font-display);
  font-size: 32px;
  font-weight: 600;
  color: var(--text-primary);
  line-height: 1;
  margin-bottom: var(--sp-2);
}

.stat-value.mono {
  font-family: var(--font-mono);
  font-size: 26px;
}

.stat-meta {
  font-size: 12px;
  color: var(--text-muted);
}

.stat-icon {
  position: absolute;
  top: var(--sp-5);
  right: var(--sp-5);
  font-size: 22px;
  opacity: 0.25;
}

/* ── SEASON SUMMARY CARDS ── */
.season-cards-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: var(--sp-5);
  margin-bottom: var(--sp-8);
}

.season-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: var(--sp-5);
  transition: border-color var(--t-base), box-shadow var(--t-base);
  cursor: pointer;
}

.season-card:hover {
  border-color: var(--border-light);
  box-shadow: var(--shadow-md);
}

.season-card-header {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  margin-bottom: var(--sp-5);
}

.season-card-icon { font-size: 22px; }

.season-card-name {
  font-family: var(--font-display);
  font-size: 16px;
  font-weight: 600;
  color: var(--text-primary);
}

.season-card-months {
  font-size: 11px;
  color: var(--text-muted);
}

.season-stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--sp-3);
}

.season-stat {
  background: var(--bg-3);
  border-radius: var(--r-md);
  padding: var(--sp-3);
}

.season-stat-label {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-muted);
  margin-bottom: 4px;
}

.season-stat-value {
  font-size: 18px;
  font-weight: 700;
  color: var(--text-primary);
}

.season-stat-value.mono {
  font-family: var(--font-mono);
  font-size: 16px;
}

/* Season color accents */
.season-card.fall   { border-top: 3px solid var(--accent); }
.season-card.winter { border-top: 3px solid var(--blue); }
.season-card.spring { border-top: 3px solid var(--green); }

/* ── PAF STATUS SUMMARY ── */
.paf-status-row {
  display: flex;
  align-items: center;
  gap: var(--sp-4);
  padding: var(--sp-4);
  background: var(--bg-3);
  border-radius: var(--r-md);
  margin-bottom: var(--sp-3);
}

.paf-season-label {
  width: 80px;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-secondary);
}

.paf-progress-bar-track {
  flex: 1;
  height: 6px;
  background: var(--border);
  border-radius: var(--r-full);
  overflow: hidden;
}

.paf-progress-bar-fill {
  height: 100%;
  border-radius: var(--r-full);
  transition: width 0.6s ease;
}

.paf-progress-bar-fill.fall   { background: var(--accent); }
.paf-progress-bar-fill.winter { background: var(--blue); }
.paf-progress-bar-fill.spring { background: var(--green); }

.paf-progress-label {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text-muted);
  width: 80px;
  text-align: right;
}

/* ── SCHOOL INFO BANNER ── */
.school-banner {
  background: linear-gradient(135deg, var(--bg-card) 0%, var(--bg-3) 100%);
  border: 1px solid var(--border-light);
  border-radius: var(--r-xl);
  padding: var(--sp-6) var(--sp-8);
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: var(--sp-8);
  position: relative;
  overflow: hidden;
}

.school-banner::after {
  content: '';
  position: absolute;
  top: -30px; right: -30px;
  width: 180px; height: 180px;
  background: radial-gradient(circle, var(--accent-dim) 0%, transparent 70%);
  pointer-events: none;
}

.school-banner-left {}

.school-banner-greeting {
  font-size: 12px;
  color: var(--text-muted);
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  margin-bottom: var(--sp-2);
}

.school-banner-name {
  font-family: var(--font-display);
  font-size: 26px;
  font-weight: 600;
  color: var(--text-primary);
  letter-spacing: -0.3px;
}

.school-banner-year {
  font-size: 13px;
  color: var(--accent);
  font-weight: 500;
  margin-top: var(--sp-1);
}

.school-banner-right {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: var(--sp-2);
}

.school-banner-total-label {
  font-size: 11px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.school-banner-total-value {
  font-family: var(--font-mono);
  font-size: 28px;
  font-weight: 700;
  color: var(--green);
}

/* ── QUICK ACTION BUTTONS ── */
.quick-actions {
  display: flex;
  gap: var(--sp-3);
  margin-bottom: var(--sp-8);
  flex-wrap: wrap;
}

.quick-action-btn {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  padding: var(--sp-4) var(--sp-5);
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  cursor: pointer;
  transition: all var(--t-fast);
  flex: 1;
  min-width: 160px;
}

.quick-action-btn:hover {
  border-color: var(--accent);
  background: var(--accent-dim);
}

.quick-action-icon {
  font-size: 20px;
  width: 36px; height: 36px;
  display: flex; align-items: center; justify-content: center;
  background: var(--bg-3);
  border-radius: var(--r-md);
  flex-shrink: 0;
}

.quick-action-label {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-primary);
}

.quick-action-sub {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 2px;
}
</style>
