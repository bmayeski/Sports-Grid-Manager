<script>
/* ============================================================
   UI.JS — DOM Rendering, Modals, Toasts, Form Building
   ============================================================ */

const UI = (() => {

  // ── TOAST SYSTEM ────────────────────────────────────────────

  const TOAST_ICONS = { success: '✅', error: '❌', info: 'ℹ️', warning: '⚠️' };

  function toast(message, type = 'info', duration = 3500) {
    const container = document.getElementById('toast-container');
    const el = document.createElement('div');
    el.className = `toast toast-${type}`;
    el.innerHTML = `
      <span class="toast-icon">${TOAST_ICONS[type]}</span>
      <span class="toast-message">${message}</span>
    `;
    container.appendChild(el);
    setTimeout(() => {
      el.classList.add('toast-exit');
      el.addEventListener('animationend', () => el.remove());
    }, duration);
  }

  // ── MODAL SYSTEM ────────────────────────────────────────────

  let _modalResolve = null;

  function openModal({ title, bodyHtml, footerHtml, size = '' }) {
    const overlay  = document.getElementById('modal-overlay');
    const box      = document.getElementById('modal-box');
    const titleEl  = document.getElementById('modal-title');
    const bodyEl   = document.getElementById('modal-body');
    const footerEl = document.getElementById('modal-footer');

    titleEl.textContent = title;
    bodyEl.innerHTML    = bodyHtml || '';
    footerEl.innerHTML  = footerHtml || '';

    box.className = `modal-box ${size}`;
    overlay.classList.remove('hidden');
  }

  function closeModal() {
    document.getElementById('modal-overlay').classList.add('hidden');
    document.getElementById('modal-body').innerHTML    = '';
    document.getElementById('modal-footer').innerHTML  = '';
    if (_modalResolve) { _modalResolve(null); _modalResolve = null; }
  }

  function confirm({ title, message, confirmText = 'Confirm', danger = false }) {
    return new Promise(resolve => {
      _modalResolve = resolve;
      openModal({
        title,
        size: 'modal-sm',
        bodyHtml: `<p style="color:var(--text-secondary);line-height:1.7;">${message}</p>`,
        footerHtml: `
          <button class="btn btn-ghost" onclick="UI.closeModal()">Cancel</button>
          <button class="btn ${danger ? 'btn-danger' : 'btn-primary'}" id="modal-confirm-btn">${confirmText}</button>
        `
      });
      setTimeout(() => {
        const btn = document.getElementById('modal-confirm-btn');
        if (btn) btn.addEventListener('click', () => { resolve(true); closeModal(); });
      }, 0);
    });
  }

  // ── LOADING HELPERS ──────────────────────────────────────────

  function setContent(html) {
    document.getElementById('content-area').innerHTML = html;
  }

  function showContentLoader(label = 'Loading...') {
    setContent(`
      <div style="display:flex;align-items:center;justify-content:center;height:300px;flex-direction:column;gap:16px;">
        <div class="loading-spinner"></div>
        <p style="color:var(--text-muted);font-size:13px;">${label}</p>
      </div>
    `);
  }

  // ── DASHBOARD RENDERER ───────────────────────────────────────

  function renderDashboard(summary, stipendLookup) {
    const totalAllStipends = Object.values(summary.totalStipends)
      .reduce((a, b) => a + b, 0);
    const totalAllCoaches = Object.values(summary.totalCoaches)
      .reduce((a, b) => a + b, 0);
    const totalPendingPAF = Object.values(summary.pendingPAF)
      .reduce((a, b) => a + b, 0);

    const seasonMeta = {
      Fall:   { icon: '🍂', months: 'Oct · Nov · Dec', cls: 'fall'   },
      Winter: { icon: '❄️', months: 'Jan · Feb · Mar',  cls: 'winter' },
      Spring: { icon: '🌸', months: 'Apr · May · Jun',  cls: 'spring' },
    };

    const pafRows = ['Fall','Winter','Spring'].map(s => {
      const total   = summary.totalCoaches[s] || 0;
      const pending = summary.pendingPAF[s]    || 0;
      const done    = total - pending;
      const pct     = total > 0 ? Math.round((done / total) * 100) : 0;
      return `
        <div class="paf-status-row">
          <span class="paf-season-label">${s}</span>
          <div class="paf-progress-bar-track">
            <div class="paf-progress-bar-fill ${s.toLowerCase()}" style="width:${pct}%"></div>
          </div>
          <span class="paf-progress-label">${done}/${total} PAFs</span>
        </div>`;
    }).join('');

    const seasonCards = ['Fall','Winter','Spring'].map(s => {
      const m = seasonMeta[s];
      return `
        <div class="season-card ${m.cls}" onclick="APP.navigate('${s}')" style="cursor:pointer;">
          <div class="season-card-header">
            <span class="season-card-icon">${m.icon}</span>
            <div>
              <div class="season-card-name">${s} Season</div>
              <div class="season-card-months">${m.months}</div>
            </div>
          </div>
          <div class="season-stats">
            <div class="season-stat">
              <div class="season-stat-label">Coaches</div>
              <div class="season-stat-value">${summary.totalCoaches[s] || 0}</div>
            </div>
            <div class="season-stat">
              <div class="season-stat-label">Sports</div>
              <div class="season-stat-value">${summary.sportsCounts[s] || 0}</div>
            </div>
            <div class="season-stat">
              <div class="season-stat-label">Stipends</div>
              <div class="season-stat-value mono">${API.formatCurrency(summary.totalStipends[s])}</div>
            </div>
            <div class="season-stat">
              <div class="season-stat-label">Pending PAF</div>
              <div class="season-stat-value" style="color:${summary.pendingPAF[s] > 0 ? 'var(--red)' : 'var(--green)'}">
                ${summary.pendingPAF[s] || 0}
              </div>
            </div>
          </div>
        </div>`;
    }).join('');

    const lookupRows = stipendLookup.map(r => `
      <tr>
        <td>${r['Position']}</td>
        <td>${API.formatCurrency(r['1-3'])}</td>
        <td>${API.formatCurrency(r['4-6'])}</td>
        <td>${API.formatCurrency(r['7-9'])}</td>
        <td>${API.formatCurrency(r['10+'])}</td>
      </tr>`).join('');

    setContent(`
      <div class="school-banner">
        <div class="school-banner-left">
          <div class="school-banner-greeting">Athletic Program</div>
          <div class="school-banner-name">${summary.school}</div>
          <div class="school-banner-year">Fiscal Year ${new Date().getFullYear()}</div>
        </div>
        <div class="school-banner-right">
          <span class="school-banner-total-label">Total Stipends</span>
          <span class="school-banner-total-value">${API.formatCurrency(totalAllStipends)}</span>
        </div>
      </div>

      <div class="stats-grid">
        <div class="stat-card gold">
          <span class="stat-icon">🏆</span>
          <div class="stat-label">Total Coaches</div>
          <div class="stat-value">${totalAllCoaches}</div>
          <div class="stat-meta">Across all 3 seasons</div>
        </div>
        <div class="stat-card green">
          <span class="stat-icon">💰</span>
          <div class="stat-label">Total Stipends</div>
          <div class="stat-value mono">${API.formatCurrency(totalAllStipends)}</div>
          <div class="stat-meta">All seasons combined</div>
        </div>
        <div class="stat-card red">
          <span class="stat-icon">📋</span>
          <div class="stat-label">Pending PAFs</div>
          <div class="stat-value" style="color:${totalPendingPAF > 0 ? 'var(--red)' : 'var(--green)'}">${totalPendingPAF}</div>
          <div class="stat-meta">Awaiting PAF numbers</div>
        </div>
        <div class="stat-card blue">
          <span class="stat-icon">⚽</span>
          <div class="stat-label">Total Sports</div>
          <div class="stat-value">${Object.values(summary.sportsCounts).reduce((a,b)=>a+b,0)}</div>
          <div class="stat-meta">Across all seasons</div>
        </div>
      </div>

      <div class="section-header">
        <span class="section-title">Season Overview</span>
        <div class="section-line"></div>
      </div>
      <div class="season-cards-grid">${seasonCards}</div>

      <div class="section-header">
        <span class="section-title">PAF Completion Status</span>
        <div class="section-line"></div>
      </div>
      <div class="card card-sm" style="margin-bottom:var(--sp-8);">
        ${pafRows}
      </div>

      <div class="section-header">
        <span class="section-title">Stipend Lookup Reference</span>
        <div class="section-line"></div>
      </div>
      <div class="lookup-table-wrapper">
        <table class="lookup-table">
          <thead>
            <tr>
              <th>Position</th>
              <th>Years 1–3</th>
              <th>Years 4–6</th>
              <th>Years 7–9</th>
              <th>Years 10+</th>
            </tr>
          </thead>
          <tbody>${lookupRows}</tbody>
        </table>
      </div>
    `);
  }

  // ── SEASON VIEW RENDERER ──────────────────────────────────────

  const SEASON_META = {
    Fall:   { icon: '🍂', color: 'var(--accent)',  months: ['October','November','December']   },
    Winter: { icon: '❄️', color: 'var(--blue)',    months: ['January','February','March']      },
    Spring: { icon: '🌸', color: 'var(--green)',   months: ['April','May','June']              },
  };

  function renderSeasonView(season, sportsList, seasonData, coachRoster, stipendLookup) {
    const meta = SEASON_META[season];

    // Index season data by sport+gender+coachName for quick lookup
    const assignmentMap = {};
    seasonData.forEach(row => {
      const key = `${row['Sport']}|${row['Gender']}`;
      if (!assignmentMap[key]) assignmentMap[key] = [];
      assignmentMap[key].push(row);
    });

    const genders = ['Boys', 'Girls'];
    let blocksHtml = '';

    genders.forEach(gender => {
      const sports = (sportsList[season] && sportsList[season][gender]) || [];
      const genderColor = gender === 'Boys' ? 'var(--blue)' : '#f472b6';

      blocksHtml += `
        <div class="gender-divider gender-${gender.toLowerCase()}">
          <span class="gender-divider-label">${gender === 'Boys' ? '♂ Boys' : '♀ Girls'}</span>
          <div class="gender-divider-line"></div>
          <button class="btn btn-sm btn-ghost" onclick="APP.addSport('${season}','${gender}')">+ Add Sport</button>
        </div>
      `;

      if (sports.length === 0) {
        blocksHtml += `
          <div class="empty-state" style="padding:var(--sp-8) 0;">
            <div class="empty-state-icon">🏅</div>
            <div class="empty-state-title">No ${gender.toLowerCase()} sports this season</div>
            <p>Click <strong>+ Add Sport</strong> to add one.</p>
          </div>`;
      } else {
        sports.forEach(sport => {
          const key = `${sport}|${gender}`;
          const assignments = assignmentMap[key] || [];
          blocksHtml += renderSportBlock(season, gender, sport, assignments, stipendLookup, meta);
        });
      }
    });

    setContent(`
      <div class="page-header">
        <div class="page-header-left">
          <div class="page-title">${meta.icon} ${season} Season</div>
          <div class="page-subtitle">
            ${meta.months.join(' · ')} &nbsp;·&nbsp;
            ${seasonData.length} coach assignment${seasonData.length !== 1 ? 's' : ''}
          </div>
        </div>
        <div class="page-actions">
          <button class="btn btn-secondary" onclick="APP.exportSeason('${season}')">Export CSV</button>
        </div>
      </div>
      ${blocksHtml}
      <div style="height:var(--sp-16);"></div>
    `);
  }

  function renderSportBlock(season, gender, sport, assignments, stipendLookup, meta) {
    const coachRowsHtml = assignments.length > 0
      ? assignments.map(a => renderCoachRow(season, a, stipendLookup, meta)).join('')
      : `<p style="color:var(--text-muted);font-size:13px;padding:var(--sp-2) 0;">No coaches assigned yet.</p>`;

    return `
      <div class="sport-block" id="sport-block-${sport.replace(/\s+/g,'-')}-${gender}">
        <div class="sport-block-header">
          <div class="sport-block-title">
            ${sport}
            <span class="badge ${gender === 'Boys' ? 'badge-blue' : ''}" style="${gender === 'Girls' ? 'background:rgba(244,114,182,0.15);color:#f472b6;' : ''}">${gender}</span>
            <span class="badge badge-neutral">${assignments.length} coach${assignments.length !== 1 ? 'es' : ''}</span>
          </div>
          <div class="sport-block-actions">
            <button class="btn btn-sm btn-ghost btn-danger" onclick="APP.removeSport('${season}','${gender}','${sport}')">Remove Sport</button>
          </div>
        </div>
        <div class="sport-block-body">
          ${coachRowsHtml}
          <button class="add-coach-btn" onclick="APP.openCoachModal('${season}','${gender}','${sport}',null)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M12 5v14M5 12h14"/>
            </svg>
            Add Coach
          </button>
        </div>
      </div>
    `;
  }

  function renderCoachRow(season, a, stipendLookup, meta) {
    const months     = meta.months;
    const stipendAmt = parseFloat(a['StipendAmt']) || 0;
    const pct        = parseFloat(a['StipendPct']) || 1;
    const [m1, m2, m3] = [
      parseFloat(a['Month1Amt']) || Math.round(stipendAmt / 3 * 100) / 100,
      parseFloat(a['Month2Amt']) || Math.round(stipendAmt / 3 * 100) / 100,
      parseFloat(a['Month3Amt']) || Math.round((stipendAmt - Math.round(stipendAmt/3*100)/100 * 2) * 100) / 100,
    ];

    const classBadge = a['Classification'] === 'Certificated'
      ? '<span class="badge class-certificated">Certificated</span>'
      : '<span class="badge class-classified">Classified</span>';

    return `
      <div class="card card-sm" style="margin-bottom:var(--sp-3);background:var(--bg-2);">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:var(--sp-4);">
          <div style="flex:1;">
            <!-- Row 1: Coach Identity -->
            <div class="form-row form-row-4" style="margin-bottom:var(--sp-3);">
              <div>
                <div class="coach-row-label">Coach Name</div>
                <div class="coach-row-value fw-600">${a['CoachName'] || '—'}</div>
              </div>
              <div>
                <div class="coach-row-label">Employee ID</div>
                <div class="coach-row-value mono">${a['EmployeeID'] || '—'}</div>
              </div>
              <div>
                <div class="coach-row-label">Emp Rec #</div>
                <div class="coach-row-value mono">${a['EmployeeRecNum'] || '—'}</div>
              </div>
              <div>
                <div class="coach-row-label">Position #</div>
                <div class="coach-row-value mono">${a['PositionNum'] || '—'}</div>
              </div>
            </div>
            <!-- Row 2: Codes & Classification -->
            <div class="form-row form-row-4" style="margin-bottom:var(--sp-3);">
              <div>
                <div class="coach-row-label">Combo Code</div>
                <div class="coach-row-value mono">${a['ComboCode'] || '—'}</div>
              </div>
              <div>
                <div class="coach-row-label">Classification</div>
                <div style="margin-top:2px;">${classBadge}</div>
              </div>
              <div>
                <div class="coach-row-label">Position Code</div>
                <div class="coach-row-value">${a['PositionCode'] || '—'}</div>
              </div>
              <div>
                <div class="coach-row-label">Years Exp.</div>
                <div class="coach-row-value">${a['YearsExp'] || '—'} <span style="color:var(--text-muted);font-size:11px;">(${a['ExpTier'] || '—'} tier)</span></div>
              </div>
            </div>
            <!-- Row 3: Stipend Info -->
            <div class="form-row form-row-4" style="margin-bottom:var(--sp-4);">
              <div>
                <div class="coach-row-label">Stipend %</div>
                <div class="coach-row-value" style="color:var(--accent);font-family:var(--font-mono);">${Math.round(pct * 100)}%</div>
              </div>
              <div>
                <div class="coach-row-label">Stipend Amt</div>
                <div class="coach-row-value" style="color:var(--green);font-family:var(--font-mono);font-weight:700;">${API.formatCurrency(stipendAmt)}</div>
              </div>
              <div>
                <div class="coach-row-label">PAF Number</div>
                <div class="coach-row-value mono">${a['PAFNumber'] ? `<span style="color:var(--green)">${a['PAFNumber']}</span>` : '<span style="color:var(--red)">Pending</span>'}</div>
              </div>
              <div>
                <div class="coach-row-label">Payment Split</div>
                <div class="payment-breakdown" style="margin-top:2px;">
                  <div class="payment-pill">
                    <div class="payment-pill-month">${months[0].slice(0,3)}</div>
                    <div class="payment-pill-amt">${API.formatCurrency(m1)}</div>
                  </div>
                  <div class="payment-pill">
                    <div class="payment-pill-month">${months[1].slice(0,3)}</div>
                    <div class="payment-pill-amt">${API.formatCurrency(m2)}</div>
                  </div>
                  <div class="payment-pill">
                    <div class="payment-pill-month">${months[2].slice(0,3)}</div>
                    <div class="payment-pill-amt">${API.formatCurrency(m3)}</div>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <!-- Actions -->
          <div style="display:flex;flex-direction:column;gap:var(--sp-2);flex-shrink:0;">
            <button class="btn btn-sm btn-ghost"
              onclick="APP.openCoachModal('${season}','${a['Gender']}','${a['Sport']}',${a['RowIndex']})">
              ✏️ Edit
            </button>
            <button class="btn btn-sm btn-danger"
              onclick="APP.deleteCoach('${season}',${a['RowIndex']},'${a['CoachName']}')">
              🗑️ Remove
            </button>
          </div>
        </div>
      </div>
    `;
  }

  // ── COACH MODAL FORM ─────────────────────────────────────────

  function renderCoachModal(season, gender, sport, existingData, coachRoster, stipendLookup) {
    const isEdit = !!existingData;
    const d = existingData || {};
    const meta = SEASON_META[season];
    const months = meta.months;

    const positionOptions = ['Head Coach','Assistant Coach','JV Coach','Freshman Coach']
      .map(p => `<option value="${p}" ${d['PositionCode'] === p ? 'selected' : ''}>${p}</option>`).join('');

    const tierOptions = ['1-3','4-6','7-9','10+']
      .map(t => `<option value="${t}" ${d['ExpTier'] === t ? 'selected' : ''}>${t} years</option>`).join('');

    const classOptions = ['Certificated','Classified']
      .map(c => `<option value="${c}" ${d['Classification'] === c ? 'selected' : ''}>${c}</option>`).join('');

    const pct = d['StipendPct'] !== undefined ? Math.round(parseFloat(d['StipendPct']) * 100) : 100;
    const stipendAmt = parseFloat(d['StipendAmt']) || 0;
    const [m1Def, m2Def, m3Def] = API.splitStipend(stipendAmt);

    openModal({
      title: `${isEdit ? '✏️ Edit' : '➕ Add'} Coach — ${sport} (${gender})`,
      size: 'modal-lg',
      bodyHtml: `
        <div style="display:flex;flex-direction:column;gap:var(--sp-5);">

          <!-- Coach Lookup -->
          <div class="form-group">
            <label class="form-label">Search Coach Roster</label>
            <div class="autocomplete-wrapper">
              <input type="text" class="form-input" id="coach-search-input"
                placeholder="Type name to search..."
                value="${d['CoachName'] || ''}"
                autocomplete="off"/>
              <div class="autocomplete-dropdown hidden" id="coach-dropdown"></div>
            </div>
          </div>

          <!-- Auto-populated fields (read-only after selection) -->
          <div class="form-row form-row-4">
            <div class="form-group">
              <label class="form-label">Employee ID</label>
              <input type="text" class="form-input" id="f-emp-id" value="${d['EmployeeID'] || ''}" readonly/>
            </div>
            <div class="form-group">
              <label class="form-label">Employee Rec #</label>
              <input type="text" class="form-input" id="f-emp-rec" value="${d['EmployeeRecNum'] || ''}" readonly/>
            </div>
            <div class="form-group">
              <label class="form-label">Position #</label>
              <input type="text" class="form-input" id="f-pos-num" value="${d['PositionNum'] || ''}" readonly/>
            </div>
            <div class="form-group">
              <label class="form-label">Combo Code</label>
              <input type="text" class="form-input" id="f-combo" value="${d['ComboCode'] || ''}" readonly/>
            </div>
          </div>

          <div class="form-row form-row-3">
            <div class="form-group">
              <label class="form-label">Classification</label>
              <select class="form-select" id="f-class">${classOptions}</select>
            </div>
            <div class="form-group">
              <label class="form-label">Position Code</label>
              <select class="form-select" id="f-pos-code">${positionOptions}</select>
            </div>
            <div class="form-group">
              <label class="form-label">Years of Experience</label>
              <input type="number" class="form-input" id="f-years-exp" min="0" value="${d['YearsExp'] || ''}" placeholder="e.g. 5"/>
            </div>
          </div>

          <!-- Experience Tier (auto or manual) -->
          <div class="form-row form-row-3">
            <div class="form-group">
              <label class="form-label">Experience Tier</label>
              <select class="form-select" id="f-exp-tier">${tierOptions}</select>
            </div>
            <div class="form-group">
              <label class="form-label">Stipend %</label>
              <div class="form-input-group">
                <input type="number" class="form-input" id="f-stipend-pct"
                  min="1" max="100" value="${pct}" placeholder="100"
                  oninput="UI.recalcStipend()"/>
                <span class="form-input-prefix" style="left:auto;right:12px;transform:none;top:50%;margin-top:-8px;">%</span>
              </div>
            </div>
            <div class="form-group">
              <label class="form-label">Stipend Amount</label>
              <div class="form-input-group">
                <span class="form-input-prefix">$</span>
                <input type="text" class="form-input" id="f-stipend-amt"
                  value="${stipendAmt.toFixed(2)}" readonly
                  style="color:var(--green);font-family:var(--font-mono);font-weight:600;"/>
              </div>
            </div>
          </div>

          <!-- PAF Number -->
          <div class="form-row form-row-2">
            <div class="form-group">
              <label class="form-label">PAF Number</label>
              <input type="text" class="form-input" id="f-paf" value="${d['PAFNumber'] || ''}" placeholder="Enter when generated"/>
            </div>
          </div>

          <!-- Monthly Payment Breakdown -->
          <div>
            <label class="form-label" style="margin-bottom:var(--sp-3);display:block;">Monthly Payment Breakdown</label>
            <div style="background:var(--bg-3);border-radius:var(--r-md);padding:var(--sp-4);display:flex;flex-direction:column;gap:var(--sp-3);">
              ${months.map((m, i) => `
                <div style="display:grid;grid-template-columns:120px 1fr;gap:var(--sp-3);align-items:center;">
                  <span style="font-size:13px;color:var(--text-secondary);">${m}</span>
                  <div class="form-input-group">
                    <span class="form-input-prefix">$</span>
                    <input type="number" class="form-input" id="f-month-${i+1}" step="0.01"
                      value="${[parseFloat(d['Month1Amt'])||m1Def, parseFloat(d['Month2Amt'])||m2Def, parseFloat(d['Month3Amt'])||m3Def][i].toFixed(2)}"
                      oninput="UI.validateMonthlyTotal()"/>
                  </div>
                </div>`).join('')}
              <div style="display:flex;align-items:center;justify-content:flex-end;gap:var(--sp-3);">
                <button class="btn btn-sm btn-ghost" type="button" onclick="UI.recalcStipend()">↺ Recalculate Even Split</button>
                <span id="monthly-total-display" class="split-pct-total valid">Total: $${stipendAmt.toFixed(2)}</span>
              </div>
            </div>
          </div>

        </div>
        <!-- Hidden state -->
        <input type="hidden" id="f-season"   value="${season}"/>
        <input type="hidden" id="f-gender"   value="${gender}"/>
        <input type="hidden" id="f-sport"    value="${sport}"/>
        <input type="hidden" id="f-row-idx"  value="${d['RowIndex'] || ''}"/>
        <input type="hidden" id="f-coach-name" value="${d['CoachName'] || ''}"/>
      `,
      footerHtml: `
        <button class="btn btn-ghost" onclick="UI.closeModal()">Cancel</button>
        <button class="btn btn-primary" onclick="APP.saveCoach()">
          ${isEdit ? '💾 Save Changes' : '✅ Add Coach'}
        </button>
      `,
    });

    // Wire up autocomplete after DOM insert
    setTimeout(() => {
      initCoachAutocomplete(coachRoster);
      wireStipendRecalc(stipendLookup);
    }, 50);
  }

  // ── AUTOCOMPLETE ──────────────────────────────────────────────

  function initCoachAutocomplete(roster) {
    const input    = document.getElementById('coach-search-input');
    const dropdown = document.getElementById('coach-dropdown');
    if (!input || !dropdown) return;

    input.addEventListener('input', () => {
      const q = input.value.toLowerCase().trim();
      if (!q) { dropdown.classList.add('hidden'); return; }
      const matches = roster.filter(c =>
        c['Name'].toLowerCase().includes(q) || c['EmployeeID'].toString().toLowerCase().includes(q)
      ).slice(0, 8);

      if (!matches.length) { dropdown.classList.add('hidden'); return; }
      dropdown.innerHTML = matches.map(c => `
        <div class="autocomplete-item" data-idx="${roster.indexOf(c)}">
          <span class="autocomplete-name">${c['Name']}</span>
          <span class="autocomplete-meta">ID: ${c['EmployeeID']} · ${c['Classification']} · ${c['PositionCode']}</span>
        </div>
      `).join('');
      dropdown.classList.remove('hidden');

      dropdown.querySelectorAll('.autocomplete-item').forEach(item => {
        item.addEventListener('click', () => {
          const coach = roster[parseInt(item.dataset.idx)];
          fillCoachFields(coach);
          dropdown.classList.add('hidden');
          input.value = coach['Name'];
        });
      });
    });

    document.addEventListener('click', e => {
      if (!dropdown.contains(e.target) && e.target !== input) {
        dropdown.classList.add('hidden');
      }
    }, { once: false });
  }

  function fillCoachFields(coach) {
    const set = (id, val) => { const el = document.getElementById(id); if (el) el.value = val || ''; };
    set('f-coach-name', coach['Name']);
    set('f-emp-id',     coach['EmployeeID']);
    set('f-emp-rec',    coach['EmployeeRecNum']);
    set('f-pos-num',    coach['PositionNum']);
    set('f-combo',      coach['ComboCode']);
    const cls = document.getElementById('f-class');
    if (cls) cls.value = coach['Classification'] || 'Certificated';
    const pos = document.getElementById('f-pos-code');
    if (pos) pos.value = coach['PositionCode'] || 'Head Coach';
  }

  // ── STIPEND RECALCULATION ──────────────────────────────────────

  let _stipendLookupRef = [];

  function wireStipendRecalc(stipendLookup) {
    _stipendLookupRef = stipendLookup;
    const posEl  = document.getElementById('f-pos-code');
    const tierEl = document.getElementById('f-exp-tier');
    const pctEl  = document.getElementById('f-stipend-pct');
    const yrsEl  = document.getElementById('f-years-exp');

    [posEl, tierEl, pctEl].forEach(el => {
      if (el) el.addEventListener('change', recalcStipend);
    });

    if (yrsEl) {
      yrsEl.addEventListener('input', () => {
        const yrs = parseInt(yrsEl.value) || 0;
        const tier = yrs <= 3 ? '1-3' : yrs <= 6 ? '4-6' : yrs <= 9 ? '7-9' : '10+';
        const tierEl = document.getElementById('f-exp-tier');
        if (tierEl) tierEl.value = tier;
        recalcStipend();
      });
    }
  }

  function recalcStipend() {
    const pos  = document.getElementById('f-pos-code')?.value    || '';
    const tier = document.getElementById('f-exp-tier')?.value    || '';
    const pct  = (parseFloat(document.getElementById('f-stipend-pct')?.value) || 100) / 100;
    const amt  = API.calcStipend(_stipendLookupRef, pos, tier, pct);

    const amtEl = document.getElementById('f-stipend-amt');
    if (amtEl) amtEl.value = amt.toFixed(2);

    const [m1, m2, m3] = API.splitStipend(amt);
    const setMonth = (id, v) => { const el = document.getElementById(id); if (el) el.value = v.toFixed(2); };
    setMonth('f-month-1', m1);
    setMonth('f-month-2', m2);
    setMonth('f-month-3', m3);
    validateMonthlyTotal();
  }

  function validateMonthlyTotal() {
    const amt = parseFloat(document.getElementById('f-stipend-amt')?.value) || 0;
    const m1  = parseFloat(document.getElementById('f-month-1')?.value) || 0;
    const m2  = parseFloat(document.getElementById('f-month-2')?.value) || 0;
    const m3  = parseFloat(document.getElementById('f-month-3')?.value) || 0;
    const total = Math.round((m1 + m2 + m3) * 100) / 100;
    const el = document.getElementById('monthly-total-display');
    if (!el) return;
    const match = Math.abs(total - amt) < 0.02;
    el.textContent = `Total: ${API.formatCurrency(total)}`;
    el.className = `split-pct-total ${match ? 'valid' : 'invalid'}`;
  }

  // ── ADD SPORT MODAL ───────────────────────────────────────────

  function renderAddSportModal(season, gender, existingSports) {
    openModal({
      title: `Add Sport — ${season} ${gender}`,
      size: 'modal-sm',
      bodyHtml: `
        <div style="display:flex;flex-direction:column;gap:var(--sp-4);">
          <div class="form-group">
            <label class="form-label">Sport Name</label>
            <input type="text" class="form-input" id="new-sport-input" placeholder="e.g. Volleyball" autocomplete="off"/>
          </div>
          <p style="font-size:12px;color:var(--text-muted);">
            This will add the sport to ${gender}'s ${season} season for your school only.
          </p>
        </div>
        <input type="hidden" id="new-sport-season" value="${season}"/>
        <input type="hidden" id="new-sport-gender" value="${gender}"/>
      `,
      footerHtml: `
        <button class="btn btn-ghost" onclick="UI.closeModal()">Cancel</button>
        <button class="btn btn-primary" onclick="APP.confirmAddSport()">Add Sport</button>
      `,
    });
    setTimeout(() => document.getElementById('new-sport-input')?.focus(), 50);
  }

  // ── STIPEND LOOKUP VIEW ───────────────────────────────────────

  function renderLookupView(stipendLookup) {
    const rows = stipendLookup.map(r => `
      <tr>
        <td>${r['Position']}</td>
        <td>${API.formatCurrency(r['1-3'])}</td>
        <td>${API.formatCurrency(r['4-6'])}</td>
        <td>${API.formatCurrency(r['7-9'])}</td>
        <td>${API.formatCurrency(r['10+'])}</td>
      </tr>`).join('');

    setContent(`
      <div class="page-header">
        <div class="page-header-left">
          <div class="page-title">📊 Stipend Lookup Table</div>
          <div class="page-subtitle">Reference table for base stipend amounts by position and experience tier</div>
        </div>
      </div>
      <div class="lookup-table-wrapper">
        <table class="lookup-table">
          <thead>
            <tr>
              <th>Position</th>
              <th>Years 1–3</th>
              <th>Years 4–6</th>
              <th>Years 7–9</th>
              <th>Years 10+</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      <p style="margin-top:var(--sp-4);font-size:12px;color:var(--text-muted);">
        * Stipend amounts are base values. Actual amounts are adjusted by the coach's stipend percentage.
        This table is managed in the Master Lookup spreadsheet.
      </p>
    `);
  }

  // ── SIDEBAR BADGE UPDATES ─────────────────────────────────────

  function updateBadges(summary) {
    ['Fall','Winter','Spring'].forEach(s => {
      const el = document.getElementById(`badge-${s}`);
      if (el) el.textContent = summary.totalCoaches[s] || 0;
    });
  }

  return {
    toast, openModal, closeModal, confirm,
    setContent, showContentLoader,
    renderDashboard, renderSeasonView, renderLookupView,
    renderCoachModal, renderAddSportModal,
    recalcStipend, validateMonthlyTotal,
    updateBadges,
  };
})();
</script>
