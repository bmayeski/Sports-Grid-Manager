<style>
/* ============================================================
   STYLES-MAIN.CSS — Base Layout, Variables, Typography
   Athletic Stipend Manager
   ============================================================ */

/* ── CSS CUSTOM PROPERTIES ── */
:root {
  /* Color Palette — Deep Navy + Warm Gold accent */
  --bg:            #0f1117;
  --bg-2:          #171b26;
  --bg-3:          #1e2436;
  --bg-card:       #1a1f2e;
  --bg-card-hover: #202638;

  --border:        rgba(255,255,255,0.07);
  --border-light:  rgba(255,255,255,0.12);

  --accent:        #f0a500;
  --accent-dim:    rgba(240, 165, 0, 0.15);
  --accent-hover:  #f7b733;

  --green:         #2dd4a0;
  --green-dim:     rgba(45, 212, 160, 0.12);
  --red:           #f06a6a;
  --red-dim:       rgba(240, 106, 106, 0.12);
  --blue:          #5b9cf6;
  --blue-dim:      rgba(91, 156, 246, 0.12);
  --purple:        #a78bfa;
  --purple-dim:    rgba(167, 139, 250, 0.12);

  --text-primary:  #f0f2f7;
  --text-secondary:#9ba3b8;
  --text-muted:    #5a6272;
  --text-inverse:  #0f1117;

  /* Fonts */
  --font-display: 'Fraunces', Georgia, serif;
  --font-body:    'DM Sans', system-ui, sans-serif;
  --font-mono:    'DM Mono', 'Courier New', monospace;

  /* Spacing */
  --sp-1: 4px;   --sp-2: 8px;   --sp-3: 12px;  --sp-4: 16px;
  --sp-5: 20px;  --sp-6: 24px;  --sp-8: 32px;  --sp-10: 40px;
  --sp-12: 48px; --sp-16: 64px;

  /* Radius */
  --r-sm: 6px;  --r-md: 10px;  --r-lg: 16px;  --r-xl: 24px;  --r-full: 9999px;

  /* Shadows */
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
  --shadow-md: 0 4px 16px rgba(0,0,0,0.4);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.5);
  --shadow-accent: 0 0 24px rgba(240,165,0,0.2);

  /* Topbar */
  --topbar-h: 58px;

  /* Sidebar */
  --sidebar-w: 220px;

  /* Transitions */
  --t-fast: 120ms ease;
  --t-base: 200ms ease;
  --t-slow: 350ms ease;
}

/* ── RESET ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  font-family: var(--font-body);
  font-size: 14px;
  background: var(--bg);
  color: var(--text-primary);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  line-height: 1.5;
}

a { color: var(--accent); text-decoration: none; }
a:hover { color: var(--accent-hover); }

button {
  font-family: var(--font-body);
  cursor: pointer;
  border: none;
  background: none;
  color: inherit;
}

input, select, textarea {
  font-family: var(--font-body);
  font-size: 14px;
  color: var(--text-primary);
}

.hidden { display: none !important; }

/* ── LOADING SCREEN ── */
.loading-screen {
  position: fixed; inset: 0;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: var(--sp-6);
  z-index: 9999;
}

.loading-logo {
  display: flex;
  align-items: center;
  gap: var(--sp-4);
}

.loading-title {
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 600;
  color: var(--text-primary);
  letter-spacing: -0.3px;
}

.loading-spinner {
  width: 36px; height: 36px;
  border: 3px solid var(--border-light);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

.loading-text {
  color: var(--text-muted);
  font-size: 13px;
}

/* ── UNAUTHORIZED SCREEN ── */
.unauth-screen {
  position: fixed; inset: 0;
  background: var(--bg);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
}

.unauth-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--r-xl);
  padding: var(--sp-12) var(--sp-10);
  text-align: center;
  max-width: 420px;
  width: 90%;
}

.unauth-icon { font-size: 48px; margin-bottom: var(--sp-4); }
.unauth-card h2 {
  font-family: var(--font-display);
  font-size: 24px; font-weight: 600;
  margin-bottom: var(--sp-4);
}
.unauth-card p { color: var(--text-secondary); margin-bottom: var(--sp-3); }
.unauth-email {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--accent);
  background: var(--accent-dim);
  padding: var(--sp-2) var(--sp-4);
  border-radius: var(--r-full);
  display: inline-block;
}

/* ── APP LAYOUT ── */
.app {
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
}

/* ── TOP BAR ── */
.topbar {
  height: var(--topbar-h);
  background: var(--bg-2);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 var(--sp-6);
  flex-shrink: 0;
  position: relative;
  z-index: 100;
}

.topbar-left { display: flex; align-items: center; gap: var(--sp-4); }

.topbar-logo {
  opacity: 0.9;
  transition: opacity var(--t-fast);
}
.topbar-logo:hover { opacity: 1; }

.topbar-titles {
  display: flex;
  flex-direction: column;
  line-height: 1.3;
}

.topbar-app-name {
  font-family: var(--font-display);
  font-size: 16px;
  font-weight: 600;
  color: var(--text-primary);
  letter-spacing: -0.2px;
}

.topbar-school {
  font-size: 11px;
  color: var(--accent);
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.6px;
}

.topbar-right { display: flex; align-items: center; gap: var(--sp-4); }

.topbar-user {
  font-size: 12px;
  color: var(--text-muted);
  font-family: var(--font-mono);
}

.topbar-avatar {
  width: 32px; height: 32px;
  border-radius: 50%;
  background: var(--accent-dim);
  border: 1px solid var(--accent);
  color: var(--accent);
  font-size: 12px;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ── MAIN LAYOUT ── */
.main-layout {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* ── SIDEBAR ── */
.sidebar {
  width: var(--sidebar-w);
  background: var(--bg-2);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  overflow-y: auto;
  padding: var(--sp-4) 0;
}

.sidebar-nav {
  display: flex;
  flex-direction: column;
  gap: var(--sp-1);
  padding: 0 var(--sp-3);
  flex: 1;
}

.nav-section-label {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text-muted);
  padding: var(--sp-4) var(--sp-3) var(--sp-2);
}

.nav-item {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  padding: var(--sp-3) var(--sp-3);
  border-radius: var(--r-md);
  font-size: 13px;
  font-weight: 500;
  color: var(--text-secondary);
  transition: background var(--t-fast), color var(--t-fast);
  cursor: pointer;
  width: 100%;
  text-align: left;
  position: relative;
}

.nav-item:hover {
  background: var(--bg-3);
  color: var(--text-primary);
}

.nav-item.active {
  background: var(--accent-dim);
  color: var(--accent);
}

.nav-item.active .nav-icon { color: var(--accent); }

.nav-icon {
  width: 20px; height: 20px;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
  flex-shrink: 0;
}

.nav-label { flex: 1; }

.nav-badge {
  font-family: var(--font-mono);
  font-size: 11px;
  background: var(--bg-3);
  padding: 2px 7px;
  border-radius: var(--r-full);
  color: var(--text-muted);
  min-width: 24px;
  text-align: center;
}

.nav-item.active .nav-badge {
  background: var(--accent);
  color: var(--text-inverse);
}

.sidebar-footer {
  padding: var(--sp-4) var(--sp-6);
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: flex-end;
}

.sidebar-version {
  font-size: 11px;
  color: var(--text-muted);
  font-family: var(--font-mono);
}

/* ── CONTENT AREA ── */
.content-area {
  flex: 1;
  overflow-y: auto;
  padding: var(--sp-8);
  background: var(--bg);
}

/* ── PAGE HEADER ── */
.page-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: var(--sp-8);
  gap: var(--sp-4);
}

.page-header-left {}

.page-title {
  font-family: var(--font-display);
  font-size: 28px;
  font-weight: 600;
  color: var(--text-primary);
  letter-spacing: -0.5px;
  line-height: 1.2;
  margin-bottom: var(--sp-1);
}

.page-subtitle {
  color: var(--text-muted);
  font-size: 13px;
}

.page-actions { display: flex; gap: var(--sp-3); align-items: center; }

/* ── SECTION HEADERS ── */
.section-header {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  margin-bottom: var(--sp-5);
  margin-top: var(--sp-8);
}
.section-header:first-child { margin-top: 0; }

.section-title {
  font-family: var(--font-display);
  font-size: 18px;
  font-weight: 600;
  color: var(--text-primary);
}

.section-line {
  flex: 1;
  height: 1px;
  background: var(--border);
}

/* ── SCROLLBAR STYLES ── */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--bg-3); border-radius: var(--r-full); }
::-webkit-scrollbar-thumb:hover { background: var(--border-light); }

/* ── UTILITY CLASSES ── */
.flex { display: flex; }
.flex-col { display: flex; flex-direction: column; }
.items-center { align-items: center; }
.justify-between { justify-content: space-between; }
.gap-2 { gap: var(--sp-2); }
.gap-3 { gap: var(--sp-3); }
.gap-4 { gap: var(--sp-4); }
.mt-4 { margin-top: var(--sp-4); }
.mt-6 { margin-top: var(--sp-6); }
.mt-8 { margin-top: var(--sp-8); }
.text-muted { color: var(--text-muted); }
.text-sm { font-size: 12px; }
.text-mono { font-family: var(--font-mono); }
.text-accent { color: var(--accent); }
.fw-600 { font-weight: 600; }
</style>
