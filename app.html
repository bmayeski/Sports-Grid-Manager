<script>
/* ============================================================
   APP.JS — Core Application Logic
   State management · Navigation · Action handlers
   ============================================================ */

const APP = (() => {

  // ── APP STATE ────────────────────────────────────────────────
  const state = {
    user:          null,
    currentView:   'dashboard',
    currentSeason: null,

    // Cached data (loaded once, refreshed on demand)
    cache: {
      dashboard:    null,
      stipendLookup: null,
      sportsList:   null,
      coachRoster:  null,
      seasons: { Fall: null, Winter: null, Spring: null },
    }
  };

  // ── INIT ─────────────────────────────────────────────────────

  async function init() {
    // Bind modal close button
    document.getElementById('modal-close-btn')
      .addEventListener('click', UI.closeModal);

    // Close modal on overlay click
    document.getElementById('modal-overlay')
      .addEventListener('click', e => {
        if (e.target.id === 'modal-overlay') UI.closeModal();
      });

    // Bind nav items
    document.querySelectorAll('.nav-item[data-view]').forEach(btn => {
      btn.addEventListener('click', () => navigate(btn.dataset.view));
    });

    // Check auth
    try {
      const user = await API.getCurrentUserInfo();
      if (!user.authorized) {
        showUnauthorized(user.email);
        return;
      }
      state.user = user;
      applyUserToUI(user);

      // Load shared data in parallel
      const [stipendLookup, sportsList, coachRoster] = await Promise.all([
        API.getStipendLookup(),
        API.getSportsList(),
        API.getCoachRoster(),
      ]);
      state.cache.stipendLookup = stipendLookup;
      state.cache.sportsList    = sportsList;
      state.cache.coachRoster   = coachRoster;

      // Show app
      document.getElementById('loading-screen').classList.add('hidden');
      document.getElementById('app').classList.remove('hidden');

      // Navigate to dashboard
      await navigate('dashboard');

    } catch (err) {
      console.error('Init error:', err);
      UI.toast('Failed to initialize app: ' + err.message, 'error', 8000);
      document.getElementById('loading-screen').classList.add('hidden');
    }
  }

  function applyUserToUI(user) {
    document.getElementById('topbar-school').textContent = user.school || '';
    document.getElementById('topbar-user').textContent   = user.email || '';
    const initials = (user.email || '').split('@')[0].slice(0, 2).toUpperCase();
    document.getElementById('topbar-avatar').textContent = initials;
  }

  function showUnauthorized(email) {
    document.getElementById('loading-screen').classList.add('hidden');
    document.getElementById('unauth-screen').classList.remove('hidden');
    document.getElementById('unauth-email').textContent = email || '';
  }

  // ── NAVIGATION ────────────────────────────────────────────────

  async function navigate(view) {
    state.currentView = view;

    // Update nav active state
    document.querySelectorAll('.nav-item[data-view]').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.view === view);
    });

    if (view === 'dashboard') {
      await loadDashboard();
    } else if (['Fall','Winter','Spring'].includes(view)) {
      state.currentSeason = view;
      await loadSeasonView(view);
    } else if (view === 'lookup') {
      UI.renderLookupView(state.cache.stipendLookup || []);
    }
  }

  // ── DASHBOARD ────────────────────────────────────────────────

  async function loadDashboard() {
    UI.showContentLoader('Loading dashboard...');
    try {
      const summary = await API.getDashboardSummary();
      state.cache.dashboard = summary;
      UI.renderDashboard(summary, state.cache.stipendLookup || []);
      UI.updateBadges(summary);
    } catch (err) {
      UI.toast('Error loading dashboard: ' + err.message, 'error');
    }
  }

  // ── SEASON VIEW ───────────────────────────────────────────────

  async function loadSeasonView(season) {
    UI.showContentLoader(`Loading ${season} season...`);
    try {
      const seasonData = await API.getSeasonData(season);
      state.cache.seasons[season] = seasonData;
      UI.renderSeasonView(
        season,
        state.cache.sportsList || {},
        seasonData,
        state.cache.coachRoster || [],
        state.cache.stipendLookup || []
      );
    } catch (err) {
      UI.toast('Error loading season data: ' + err.message, 'error');
    }
  }

  // ── COACH MODAL ───────────────────────────────────────────────

  /**
   * Opens the Add/Edit coach modal.
   * @param {string}      season
   * @param {string}      gender
   * @param {string}      sport
   * @param {number|null} rowIndex - null for new, row index for edit
   */
  function openCoachModal(season, gender, sport, rowIndex) {
    let existingData = null;
    if (rowIndex) {
      const seasonData = state.cache.seasons[season] || [];
      existingData = seasonData.find(r => r['RowIndex'] == rowIndex) || null;
    }
    UI.renderCoachModal(
      season, gender, sport, existingData,
      state.cache.coachRoster || [],
      state.cache.stipendLookup || []
    );
  }

  // ── SAVE COACH ────────────────────────────────────────────────

  async function saveCoach() {
    const get  = id => document.getElementById(id)?.value?.trim() || '';
    const getN = id => parseFloat(document.getElementById(id)?.value) || 0;

    const coachNameInput = document.getElementById('coach-search-input');
    const coachName = get('f-coach-name') || coachNameInput?.value?.trim() || '';

    if (!coachName) {
      UI.toast('Please enter a coach name.', 'warning');
      return;
    }

    const season   = get('f-season');
    const pct      = getN('f-stipend-pct') / 100;
    const stipAmt  = getN('f-stipend-amt');

    const data = {
      Sport:          get('f-sport'),
      Gender:         get('f-gender'),
      CoachName:      coachName,
      EmployeeID:     get('f-emp-id'),
      EmployeeRecNum: get('f-emp-rec'),
      PositionNum:    get('f-pos-num'),
      ComboCode:      get('f-combo'),
      Classification: get('f-class'),
      PositionCode:   get('f-pos-code'),
      YearsExp:       get('f-years-exp'),
      ExpTier:        get('f-exp-tier'),
      StipendPct:     pct,
      StipendAmt:     stipAmt,
      PAFNumber:      get('f-paf'),
      Month1Name:     document.getElementById('f-month-1')?.closest('.form-row')
                        ?.previousElementSibling?.textContent || '',
      Month1Amt:      getN('f-month-1'),
      Month2Name:     '',
      Month2Amt:      getN('f-month-2'),
      Month3Name:     '',
      Month3Amt:      getN('f-month-3'),
    };

    // Set month names from season
    const months = { Fall: ['October','November','December'], Winter: ['January','February','March'], Spring: ['April','May','June'] };
    const [mn1, mn2, mn3] = months[season] || [];
    data.Month1Name = mn1; data.Month2Name = mn2; data.Month3Name = mn3;

    const rowIdx = get('f-row-idx');
    if (rowIdx) data.RowIndex = parseInt(rowIdx);

    // Validate monthly total
    const totalM = Math.round((data.Month1Amt + data.Month2Amt + data.Month3Amt) * 100) / 100;
    if (Math.abs(totalM - stipAmt) > 0.05) {
      const ok = await UI.confirm({
        title: 'Monthly Total Mismatch',
        message: `The monthly payments total ${API.formatCurrency(totalM)}, but the stipend is ${API.formatCurrency(stipAmt)}. Save anyway?`,
        confirmText: 'Save Anyway',
      });
      if (!ok) return;
    }

    UI.closeModal();
    UI.toast('Saving...', 'info', 1500);

    try {
      await API.saveCoachAssignment(season, data);
      UI.toast(`Coach saved successfully!`, 'success');
      await loadSeasonView(season);
      // Refresh dashboard badge counts
      const summary = await API.getDashboardSummary();
      UI.updateBadges(summary);
    } catch (err) {
      UI.toast('Error saving coach: ' + err.message, 'error');
    }
  }

  // ── DELETE COACH ──────────────────────────────────────────────

  async function deleteCoach(season, rowIndex, coachName) {
    const confirmed = await UI.confirm({
      title: 'Remove Coach',
      message: `Remove <strong>${coachName}</strong> from ${season} season? This cannot be undone.`,
      confirmText: 'Remove',
      danger: true,
    });
    if (!confirmed) return;

    try {
      await API.deleteCoachAssignment(season, rowIndex);
      UI.toast(`${coachName} removed.`, 'success');
      await loadSeasonView(season);
      const summary = await API.getDashboardSummary();
      UI.updateBadges(summary);
    } catch (err) {
      UI.toast('Error removing coach: ' + err.message, 'error');
    }
  }

  // ── SPORT MANAGEMENT ─────────────────────────────────────────

  function addSport(season, gender) {
    const existing = (state.cache.sportsList?.[season]?.[gender]) || [];
    UI.renderAddSportModal(season, gender, existing);
  }

  async function confirmAddSport() {
    const sport  = document.getElementById('new-sport-input')?.value?.trim();
    const season = document.getElementById('new-sport-season')?.value;
    const gender = document.getElementById('new-sport-gender')?.value;

    if (!sport) { UI.toast('Please enter a sport name.', 'warning'); return; }

    const existing = state.cache.sportsList?.[season]?.[gender] || [];
    if (existing.map(s => s.toLowerCase()).includes(sport.toLowerCase())) {
      UI.toast(`${sport} already exists in ${gender}'s ${season} season.`, 'warning');
      return;
    }

    UI.closeModal();
    try {
      await API.addSportOverride(season, gender, sport);
      // Update local cache
      if (!state.cache.sportsList[season]) state.cache.sportsList[season] = { Boys:[], Girls:[] };
      if (!state.cache.sportsList[season][gender]) state.cache.sportsList[season][gender] = [];
      state.cache.sportsList[season][gender].push(sport);
      UI.toast(`${sport} added to ${gender}'s ${season} season.`, 'success');
      await loadSeasonView(season);
    } catch (err) {
      UI.toast('Error adding sport: ' + err.message, 'error');
    }
  }

  async function removeSport(season, gender, sport) {
    const confirmed = await UI.confirm({
      title: 'Remove Sport',
      message: `Remove <strong>${sport}</strong> from ${gender}'s ${season} season? Coach assignments for this sport will remain in the data sheet but won't appear in the app.`,
      confirmText: 'Remove Sport',
      danger: true,
    });
    if (!confirmed) return;

    try {
      await API.removeSportOverride(season, gender, sport);
      // Update local cache
      if (state.cache.sportsList?.[season]?.[gender]) {
        state.cache.sportsList[season][gender] =
          state.cache.sportsList[season][gender].filter(s => s !== sport);
      }
      UI.toast(`${sport} removed from ${gender}'s ${season} season.`, 'success');
      await loadSeasonView(season);
    } catch (err) {
      UI.toast('Error removing sport: ' + err.message, 'error');
    }
  }

  // ── CSV EXPORT ────────────────────────────────────────────────

  async function exportSeason(season) {
    try {
      const data = state.cache.seasons[season] || await API.getSeasonData(season);
      if (!data.length) { UI.toast('No data to export.', 'warning'); return; }

      const headers = [
        'Sport','Gender','CoachName','EmployeeID','EmployeeRecNum',
        'PositionNum','ComboCode','Classification','PositionCode',
        'YearsExp','ExpTier','StipendPct','StipendAmt',
        'PAFNumber','Month1Name','Month1Amt','Month2Name','Month2Amt','Month3Name','Month3Amt'
      ];

      const rows = data.map(r => headers.map(h => {
        const v = r[h] || '';
        return typeof v === 'string' && v.includes(',') ? `"${v}"` : v;
      }).join(','));

      const csv = [headers.join(','), ...rows].join('\n');
      const blob = new Blob([csv], { type: 'text/csv' });
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement('a');
      a.href = url;
      a.download = `${state.user?.school || 'school'}_${season}_coaches.csv`;
      a.click();
      URL.revokeObjectURL(url);
      UI.toast(`${season} season exported.`, 'success');
    } catch (err) {
      UI.toast('Export error: ' + err.message, 'error');
    }
  }

  // ── START ─────────────────────────────────────────────────────
  window.addEventListener('load', init);

  return {
    navigate,
    openCoachModal, saveCoach, deleteCoach,
    addSport, confirmAddSport, removeSport,
    exportSeason,
  };
})();
</script>
